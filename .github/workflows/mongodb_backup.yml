name: MongoDB Weekly Backup

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    name: Backup MongoDB
    runs-on: ubuntu-latest
    steps:
      - name: Install MongoDB Database Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Dump MongoDB Database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "MONGODB_URI secret is not configured!"
            exit 1
          fi
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="zenlog_backup_${TIMESTAMP}.gz"
          mongodump --uri "$MONGODB_URI" --gzip --archive="$BACKUP_FILE"
          echo "Backup generated: $BACKUP_FILE"
          ls -lh "$BACKUP_FILE"

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenlog-mongodb-backup
          path: zenlog_backup_*.gz
          retention-days: 14
